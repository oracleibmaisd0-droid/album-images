<head>
  <meta charset="UTF-8" />
  <title>Álbum de imágenes</title>
  <link rel="icon" href="https://img.icons8.com/fluency/10000/front-view.png">

  <style>
    :root {
      --bg: 15 18 25;
      --ink: 235 238 245;
      --glass-alpha: .14;
      --blur: 16px;
      --ring: 255 255 255;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font: 500 16px/1.4 'Product Sans', sans-serif;
      color: rgb(var(--ink));
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: radial-gradient(1200px 700px at 15% 10%, rgba(99,102,241,.22), transparent 60%),

                  radial-gradient(1000px 700px at 50% 100%, rgba(56,189,248,.20), transparent 55%),
                  linear-gradient(180deg, rgb(7 9 14), rgb(12 14 22));
      background-attachment: fixed;
      padding-top: clamp(72px, 10vh, 120px);
    }
    
  /* ===============================
   FONDO DIFUSO MULTICOLOR (CENTRADO)
   =============================== */

#luma-bg {
  position: fixed;
  inset: 0;
  z-index: -999;
  pointer-events: none;
  overflow: hidden;
  background: #000;
}

.luma-blob {
  position: absolute;
  width: 70vmax;
  height: 70vmax;
  max-width: 800px;
  max-height: 800px;
  border-radius: 50%;
  opacity: 0.75;
  mix-blend-mode: screen;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  filter: blur(100px);

  /* Animación combinada: movimiento + rotación */
  animation: blobAnimation 40s ease-in-out infinite alternate,
             colorChange 20s ease-in-out infinite alternate;
}

/* Diferentes duraciones para cada blob */
.luma-blob.b1 { background: #7f0000; animation-duration: 38s, 18s; }
.luma-blob.b2 { background: #007f00; animation-duration: 42s, 22s; }
.luma-blob.b3 { background: #00007f; animation-duration: 36s, 20s; }

/* Animación combinada: movimiento + giro */
@keyframes blobAnimation {
  0%   { transform: translate(-50%, -50%) translateX(-15%) translateY(-10%) scale(0.5) rotate(0deg); }
  25%  { transform: translate(-50%, -50%) translateX(10%) translateY(15%) scale(0.8) rotate(90deg); }
  50%  { transform: translate(-50%, -50%) translateX(5%) translateY(-10%) scale(0.3) rotate(180deg); }
  75%  { transform: translate(-50%, -50%) translateX(-10%) translateY(10%) scale(0.4) rotate(270deg); }
  100% { transform: translate(-50%, -50%) translateX(-15%) translateY(-5%) scale(0.6) rotate(360deg); }
}

/* Cambio suave de color */
@keyframes colorChange {
  0%   { filter: blur(100px) hue-rotate(0deg); }
  50%  { filter: blur(100px) hue-rotate(180deg); }
  100% { filter: blur(100px) hue-rotate(360deg); }
}

    /* TRANSICIONES CABECERA Y FOOTER */
    header {
      opacity: 0;
      transform: translateY(-40px);
      animation: slideDown 0.6s forwards ease-out;
    }

    footer {
      opacity: 0;
      transform: translateY(40px);
      animation: slideUp 0.6s forwards ease-out;
    }

    @keyframes slideDown {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* CABECERA TRANSLÚCIDA */
    .glass-header {
      --mx: 50%;
      --my: 50%;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: clamp(72px, 15vh, 120px); /* Altura responsive */
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      padding: 8px clamp(16px, 5vw, 48px);
      z-index: 50;
      background: color-mix(in oklab, rgba(var(--bg)/var(--glass-alpha)), transparent);
      backdrop-filter: saturate(160%) blur(var(--blur));
      -webkit-backdrop-filter: saturate(160%) blur(var(--blur));
      border-bottom: 1px solid color-mix(in oklab, rgba(var(--ink)/.08), transparent);
      box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 10px 30px rgba(0,0,0,.06);
      overflow: clip;
      isolation: isolate;
    }

    .glass-header::before,
    footer::before {
      content: "";
      position: absolute;
      inset: -40% -10%;
      pointer-events: none;
      background: radial-gradient(200px 200px at var(--mx) var(--my), rgba(var(--ring)/.55), transparent 60%);
      filter: blur(18px) saturate(130%);
      opacity: 0;
      transition: opacity .25s ease;
      mix-blend-mode: screen;
    }

    .glass-header.is-hot::before,
    footer.is-hot::before {
      opacity: 1;
    }

    .brand {
      font-weight: 700;
      opacity: .9;
    }

    .title {
      grid-column: 1 / -1;
      margin-top: -20px;
      text-align: center;
      margin-top: -20px;
      font-weight: 800;
      line-height: 0;
      letter-spacing: -0.02em;
      font-size: clamp(28px, 6.4vw, 64px);
      text-shadow: 0 1px 8px rgba(255,255,255,.06);
      align-self: start; /* título más arriba */
    }

    @media (min-width: 860px) {
      .title {
        grid-column: 2;
      }
    }

    @media (max-width: 768px) {
      .title {
        font-size: clamp(24px, 8vw, 48px);
      }
      .header-buttons {
        gap: 8px;
      }
      .header-buttons button {
        padding: 6px 12px;
        font-size: 14px;
      }
    }

    /* BOTONES CABECERA */
    .header-buttons button {
      padding: 0.5em 1em;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      font-family: 'Product Sans', sans-serif;
      transition: transform 0.2s ease;
      white-space: nowrap;
    }

    .header-buttons button:hover {
      transform: scale(1.05);
    }

    /* GALERÍA DE IFRAMES */
    main {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 10px 10px;
    }

    .iframe-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      width: auto;
      max-width: auto;
      margin: 0 auto;
    }

    @media (max-width: 768px) {
      .iframe-grid {
        grid-template-columns: 1fr;
      }
    }

    .iframe-grid a{
    display:block;
    overflow:hidden;
    border-radius:24px; /* Ajusta el valor a tu gusto */
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.iframe-grid img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    border-radius:24px; /* Esquinas redondeadas */
    opacity:0;
    transform:scale(.8);
    animation:popUp .5s forwards ease-out;
    transition:transform .3s ease;
}

.iframe-grid img:hover{
    transform:scale(1.04);
}

    @keyframes popUp {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* FOOTER GLASS */
    footer {
      position: relative;
      text-align: center;
      padding: 24px 16px;
      color: rgba(235,238,245,0.6);
      font-size: 14px;
      background: color-mix(in oklab, rgba(var(--bg)/var(--glass-alpha)), transparent);
      backdrop-filter: saturate(160%) blur(var(--blur));
      -webkit-backdrop-filter: saturate(160%) blur(var(--blur));
      border-top: 1px solid color-mix(in oklab, rgba(var(--ink)/.08), transparent);
      box-shadow: 0 -1px 0 rgba(255,255,255,.06) inset, 0 -10px 30px rgba(0,0,0,.06);
      isolation: isolate;
      overflow: clip;
    }
    
    /* Sin menu contextual */
    
    .img-touch{
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
  </style>
</head>

<body>

  <!-- FONDO DIFUSO MULTICOLOR UNIVERSAL -->
<div id="luma-bg">

  <!-- CABECERA -->

    <div class="spacer"></div>

    <div class="title">ÁLBUM DE IMÁGENES</div>
  </header>

  <!-- GALERÍA DE IFRAMES -->
  
  <main>
    <div class="iframe-grid">

<img
    class="img-touch"
    src="https://raw.githubusercontent.com/IMAGESARCH/TempoJPG/refs/heads/main/TempT.jpg"
    data-view="https://raw.githubusercontent.com/IMAGESARCH/TempoJPG/refs/heads/main/TempT.jpg"

  <!-- SCRIPT EFECTO BRILLO Y POP -->
  <script>
    const iframes = document.querySelectorAll('.iframe-grid iframe');
    iframes.forEach((iframe, i) => { iframe.style.animationDelay = `${i * 0.1}s`; });

    const header = document.getElementById('cabecera');
    const footer = document.getElementById('footer');

    function throttle(fn, wait){
      let last = 0, rafId = null, pendingArgs = null;
      return function(...args){
        const now = performance.now();
        pendingArgs = args;
        if (now - last >= wait) {
          last = now;
          fn.apply(this, pendingArgs);
          pendingArgs = null;
        } else if (!rafId) {
          rafId = requestAnimationFrame(() => {
            rafId = null; last = performance.now();
            if (pendingArgs) { fn.apply(this, pendingArgs); pendingArgs = null; }
          });
        }
      };
    }

    function updateLight(el, clientX, clientY){
      const rect = el.getBoundingClientRect();
      const x = Math.max(0, Math.min(clientX - rect.left, rect.width));
      const y = Math.max(0, Math.min(clientY - rect.top, rect.height));
      el.style.setProperty('--mx', x + 'px');
      el.style.setProperty('--my', y + 'px');
      el.classList.toggle('edge-left', x < rect.width / 2);
      el.classList.toggle('edge-right', x >= rect.width / 2);
    }

    function bindReactiveLight(el) {
      function onMove(ev) {
        el.classList.add('is-hot');
        const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
        const clientY = ev.touches ? ev.touches[0].clientY : ev.clientY;
        updateLight(el, clientX, clientY);
      }
      const throttledMove = throttle(onMove, 16);
      el.addEventListener('pointerenter', () => el.classList.add('is-hot'));
      el.addEventListener('pointermove', throttledMove);
      el.addEventListener('pointerleave', () => el.classList.remove('is-hot', 'edge-left', 'edge-right'));
      el.addEventListener('touchstart', throttledMove, { passive: true });
      el.addEventListener('touchmove', throttledMove, { passive: true });
      el.addEventListener('touchend', () => el.classList.remove('is-hot', 'edge-left', 'edge-right'));
    }

    bindReactiveLight(header);
    bindReactiveLight(footer);
    
    //selector
    
    document.querySelectorAll(".img-touch").forEach(img => {

    let timer;
    let pulsacionLarga = false;

    img.addEventListener("pointerdown", () => {

        pulsacionLarga = false;

        timer = setTimeout(() => {

            pulsacionLarga = true;

            if(confirm("¿Ver escena 3D generativa? Las escenas 3D generativas pueden contener inconsistencias. Puede navegar libremente por la escena. Es posible que la cámara no esté en la ubicación correcta desde el principio, por lo que será necesario ubicarse.")){
      window.location.href = img.dataset.link;
}

        },700);

    });

    img.addEventListener("pointerup", () => {

        clearTimeout(timer);

        if(!pulsacionLarga){
            window.open(img.dataset.view, "_blank");
        }

    });

    img.addEventListener("pointerleave", () => {
        clearTimeout(timer);
    });

    // Bloquear menú contextual
    img.addEventListener("contextmenu", e => {
        e.preventDefault();
    });

    // Bloquear arrastre de imagen
    img.addEventListener("dragstart", e => {
        e.preventDefault();
    });

});
  </script>
